name: Run Stock Alert Bot Monthly

on:
  schedule:
    # Runs automatically at 9:00 AM UTC (2:30 PM IST) on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch: # Keeps the button to let you run it manually anytime

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Main Script with Hidden Secrets
      env:
        STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      run: python main.py
